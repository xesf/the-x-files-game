# SPDX-License-Identifier: GPL-3.0-or-later
# Builds every platform and publishes a GitHub release when a version tag
# (v0.1.0, ...) is pushed. Each package holds the program, the README and
# the licence; none holds game files.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make -j4 test
      - run: make dist VERSION=${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/dist/xfiles-${{ github.ref_name }}-macos.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libasound2-dev
      - run: make -j4 && make test
      - name: Package
        run: |
          d=xfiles-${GITHUB_REF_NAME}-linux-x86_64
          mkdir -p $d
          cp build/xfiles build/xftool README.md LICENSE $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: xfiles-${{ github.ref_name }}-linux-x86_64.tar.gz

  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - run: make -j4 PLATFORM=windows CC=x86_64-w64-mingw32-gcc LDFLAGS="-static"
      - name: Package
        run: |
          d=xfiles-${GITHUB_REF_NAME}-windows-x64
          mkdir -p $d
          cp build/xfiles.exe build/xftool.exe README.md LICENSE $d/
          zip -r $d.zip $d
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: xfiles-${{ github.ref_name }}-windows-x64.zip

  watcom:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: open-watcom/setup-watcom@v1
        with:
          version: "2.0-64"
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: make -j4 dos win9x
      - name: Package
        run: |
          d=xfiles-${GITHUB_REF_NAME}-dos
          mkdir -p $d
          cp build/dos/XFILES.EXE build/dos/XFTOOL.EXE $d/
          # DOS/4GW, the DOS extender the program is linked with; Open
          # Watcom ships it for redistribution with programs built by it.
          cp "$WATCOM/binw/dos4gw.exe" $d/DOS4GW.EXE
          cp README.md $d/README.TXT
          cp LICENSE $d/LICENSE.TXT
          zip -r $d.zip $d
          d=xfiles-${GITHUB_REF_NAME}-win9x
          mkdir -p $d
          cp build/win9x/XFILES.EXE $d/
          cp README.md $d/README.TXT
          cp LICENSE $d/LICENSE.TXT
          zip -r $d.zip $d
      - uses: actions/upload-artifact@v4
        with:
          name: watcom
          path: |
            xfiles-${{ github.ref_name }}-dos.zip
            xfiles-${{ github.ref_name }}-win9x.zip

  vita:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build in the VitaSDK image
        run: |
          docker run --rm -v "$PWD:/src" -w /src vitasdk/vitasdk:latest \
            sh -c "git config --global --add safe.directory /src && make vita VERSION=${GITHUB_REF_NAME}"
          cp build/vita/xfiles.vpk xfiles-${GITHUB_REF_NAME}-vita.vpk
      - uses: actions/upload-artifact@v4
        with:
          name: vita
          path: xfiles-${{ github.ref_name }}-vita.vpk

  publish:
    needs: [macos, linux, windows, watcom, vita]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Engine builds for macOS, Linux (desktop, Steam Deck), Windows, Windows 9x, DOS and PlayStation Vita. You need your own copy of The X-Files Game; see the README for where each build looks for the game files."
